name: Open ox-content PR

on:
  push:
    branches:
      - cursor/migrate-to-ox-content-c344

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-24.04
    steps:
      - name: Create draft pull request if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          existing="$(gh pr list --repo yamanoku/archives --head yamanoku:cursor/migrate-to-ox-content-c344 --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR already exists: #$existing"
            gh pr view "$existing" --repo yamanoku/archives --json url --jq .url
            exit 0
          fi
          body="$(cat <<'EOF'
          Astro 構成の archives サイトを [ox-content](https://github.com/ubugeeei-prod/ox-content) に差し替えます。記事 Markdown・ページ・フィードの既存行動を保ったまま、コンパイルとビルドが通る状態にします。

          ## 変更内容

          - サイト生成を Astro 7 から Vite 8 + `@ox-content/vite-plugin` に切り替え
          - 既存の `src/archives` Markdown をそのまま利用
          - トップ一覧、記事ページ、404、縦書きモード、BudouX、旧記事注意、フィードバックリンクを維持
          - `rss.xml` / `llms.txt` / `llms-full.txt` と Astro 互換の `sitemap-index.xml` + `sitemap-0.xml` を生成
          - 記事内の相対リンク `./slug` を `/slug/` に書き換え
          - Pagefind の代わりに ox-content の検索インデックスを使うクライアント検索
          - 既存の OGP 生成パイプラインは維持
          - Vercel 向け `vercel.json` と Node.js 24

          ## 確認済み

          - `npm run build` 成功
          - `npm test` 成功

          この workflow は GitHub inbound mirror 環境から PR を開けるようにするための一時的なものです。PR 作成後に削除して問題ありません。
          EOF
          )"
          gh pr create --repo yamanoku/archives --base main --head cursor/migrate-to-ox-content-c344 --draft --title 'Astro から ox-content へサイトジェネレータを移行する' --body "$body"
