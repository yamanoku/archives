name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            command: npm run build
          - name: test
            command: npm test
          - name: typecheck
            command: npm run typecheck
          - name: prettier
            command: npm run prettier:check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: npm ci
        run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          CI: true
